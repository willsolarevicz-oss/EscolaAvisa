services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    environment:
      DATABASE_URL: postgresql+psycopg://escolaavisa:escolaavisa@db:5432/escolaavisa
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: escolaavisa
      POSTGRES_PASSWORD: escolaavisa
      POSTGRES_DB: escolaavisa
    ports:
      - "5432:5432"
    volumes:
      - escolaavisa_db_data:/var/lib/postgresql/data

volumes:
  escolaavisa_db_data:
